<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梦澄工作室</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #faf9f7;
      color: #2b2b2b;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      text-align: center;
      padding: 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
    }

    p {
      font-size: clamp(0.9rem, 2.4vw, 1.05rem);
      color: #8a8478;
      letter-spacing: 0.12em;
      text-indent: 0.12em;
    }
  </style>
</head>
<body>
  <h1>梦澄工作室</h1>
  <p>把梦，沉淀成澄澈的光。</p>
</body>
</html>
